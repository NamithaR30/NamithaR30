name: Update profile dashboards

on:
  push:
    paths:
      - "scripts/update_activity.py"
      - "scripts/update_projects.py"
      - ".github/workflows/update-activity.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh GitHub activity chart
        run: python scripts/update_activity.py

      - name: Refresh latest public repository cards
        run: python scripts/update_projects.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+NamithaR30@users.noreply.github.com"
          git add README.md assets/activity-30-days.svg assets/latest-project-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile dashboards"
            git pull --rebase origin main
            git push
          else
            echo "Profile dashboards are already up to date."
          fi
