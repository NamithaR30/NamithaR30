name: Update 30-day contribution chart

on:
  push:
    paths:
      - "scripts/update_activity.py"
      - ".github/workflows/update-activity.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate last-30-days chart
        run: python scripts/update_activity.py

      - name: Commit chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+NamithaR30@users.noreply.github.com"
          git add assets/activity-30-days.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 30-day activity chart"
            git push
          else
            echo "Activity chart is already up to date."
          fi
